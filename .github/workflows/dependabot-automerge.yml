name: Merge Dependabot updates
# Squash-merges Dependabot's GitHub Actions updates that stay within the same major version, once every check on the PR has passed.
# Python (signing job) updates and major bumps are left for a manual review. Nothing from the PR is checked out or run here.
on: pull_request_target
permissions:
  contents: write
  pull-requests: write
jobs:
  merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.pull_request.title }}
          URL: ${{ github.event.pull_request.html_url }}
        run: |
          case "$TITLE" in *"Bump "*" from "*" to "*) ;; *) exit 0 ;; esac
          [ "$(gh pr view "$URL" --json files --jq '[.files[].path | select(startswith(".github/workflows/") | not)] | length')" = 0 ] || exit 0
          from=$(printf '%s' "$TITLE" | sed -E 's/.* from v?([0-9]+).* to .*/\1/')
          to=$(printf '%s' "$TITLE" | sed -E 's/.* to v?([0-9]+).*/\1/')
          [ "$from" = "$to" ] || exit 0
          sleep 60  # let the PR's own checks appear
          # Wait for every check except this job itself (--watch would wait for it forever).
          for i in $(seq 1 50); do
            state=$(gh pr checks "$URL" --json name,bucket --jq '[.[] | select(.name != "merge")] | if length == 0 or any(.bucket == "pending") then "wait" elif any(.bucket == "fail" or .bucket == "cancel") then "fail" else "pass" end')
            case "$state" in
              pass) gh pr merge "$URL" --squash; exit $? ;;
              fail) echo "A check failed; leaving the PR for review."; exit 0 ;;
            esac
            sleep 30
          done
          echo "Checks did not finish in time."; exit 1
