name: Build and release
# Every push to main, pull request and manual run builds every clock face (no signing, nothing published).
# Push a tag such as v0.3.0 to also sign the update manifests, publish a GitHub release and deploy the web flasher and a mirror of the update files to GitHub Pages.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [football, f1, motogp, tetris, word, mario, luigi, pacman, home]
    steps:
      - uses: actions/checkout@v7
      - name: Check that every stored settings key is in the boot allowlist
        run: python3 firmware/tools/check-nvs-keys.py
      - name: Add the KLIPY key for GIF search (repository secret KLIPY_KEY; skipped when it is not set, e.g. pull requests from forks)
        env:
          KLIPY_KEY: ${{ secrets.KLIPY_KEY }}
        run: '[ -z "$KLIPY_KEY" ] || python3 firmware/tools/obfuscate-key.py'
      - name: Build ${{ matrix.mode }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32
          path: firmware
          command: idf.py -B build/${{ matrix.mode }} -DULTIMATRIX_MODE=${{ matrix.mode }} -DULTIMATRIX_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }} build
      - name: Merge the full-flash image for the web flasher
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32
          command: bash firmware/tools/build-webflasher.sh ${{ matrix.mode }}
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.mode }}
          path: |
            firmware/build/${{ matrix.mode }}/ultimatrix.bin
            web-flasher/firmware/${{ matrix.mode }}
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')  # only an approved release tag signs and publishes
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: build-*
          merge-multiple: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install cryptography
      - name: Sign and package update images
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          mkdir -p .tools
          (umask 077; printf '%s\n' "$UPDATE_SIGNING_KEY" > .tools/update-signing.pem)
          python firmware/tools/package-firmware.py --flat --out dist/release
          rm .tools/update-signing.pem
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --title "$GITHUB_REF_NAME" --generate-notes
      - name: Mirror the signed update files on Pages
        run: |
          mkdir -p web-flasher/updates
          cp dist/release/* web-flasher/updates/
          python firmware/tools/build-updates-page.py web-flasher/updates "$GITHUB_REF_NAME"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web-flasher
      - id: deployment
        uses: actions/deploy-pages@v5
