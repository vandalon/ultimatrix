name: Build and release
# Every push to main, pull request and manual run builds every clock face (no signing, nothing published).
# Push a tag such as v0.3.0 to also sign the update manifests, publish a GitHub release and deploy the web flasher and a mirror of the update files to GitHub Pages.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      test_signing:
        description: Also run the signing job (nothing is published)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [football, f1, motogp, tetris, word, mario, luigi, pacman, home]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check that every stored settings key is in the boot allowlist
        run: python3 firmware/tools/check-nvs-keys.py
      - name: Add the KLIPY key for GIF search (repository secret KLIPY_KEY; skipped when it is not set, e.g. pull requests from forks)
        env:
          KLIPY_KEY: ${{ secrets.KLIPY_KEY }}
        run: '[ -z "$KLIPY_KEY" ] || python3 firmware/tools/obfuscate-key.py'
      - name: Cache the downloaded Arduino component (shared by every face)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: firmware/managed_components
          key: components-${{ hashFiles('firmware/main/idf_component.yml', 'firmware/dependencies.lock') }}
      - name: Cache the compiler results of ${{ matrix.mode }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ matrix.mode }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.mode }}-
      - name: Build ${{ matrix.mode }}
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.5
          target: esp32
          path: firmware
          # The fresh checkout has new file times, so ccache compares the preprocessed source instead.
          extra_docker_args: -e CCACHE_DIR=/app/${{ github.repository }}/.ccache -e CCACHE_NODIRECT=1 -e CCACHE_MAXSIZE=120M
          command: idf.py -B build/${{ matrix.mode }} -DULTIMATRIX_MODE=${{ matrix.mode }} -DULTIMATRIX_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }} build
      - name: Merge the full-flash image for the web flasher
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.5
          target: esp32
          command: bash firmware/tools/build-webflasher.sh ${{ matrix.mode }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-${{ matrix.mode }}
          path: |
            firmware/build/${{ matrix.mode }}/ultimatrix.bin
            web-flasher/firmware/${{ matrix.mode }}
  scanner:
    # The scanner face is not released; this only keeps it compiling.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build scanner
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.5
          target: esp32
          path: firmware
          command: idf.py -B build/scanner -DULTIMATRIX_MODE=scanner -DULTIMATRIX_VERSION=dev build
  sign:
    # Only this job holds the signing key. It installs hash-pinned packages and runs nothing but the packaging script.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.test_signing  # a release tag, or a manual signing test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: build-*
          merge-multiple: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r firmware/tools/requirements-sign.txt
      - name: Sign and package update images
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          mkdir -p .tools
          (umask 077; printf '%s\n' "$UPDATE_SIGNING_KEY" > .tools/update-signing.pem)
          python firmware/tools/package-firmware.py --flat --out dist/release
          rm .tools/update-signing.pem
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-release
          path: dist/release
  release:
    needs: sign
    if: startsWith(github.ref, 'refs/tags/v')  # only a release tag publishes
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: build-*
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: signed-release
          path: dist/release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --title "$GITHUB_REF_NAME" --generate-notes
      - name: Mirror the signed update files on Pages
        run: |
          mkdir -p web-flasher/updates
          cp dist/release/* web-flasher/updates/
          python firmware/tools/build-updates-page.py web-flasher/updates "$GITHUB_REF_NAME"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: web-flasher
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
