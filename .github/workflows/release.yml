name: Build and release
# Push a tag such as v0.3.0 to build every clock face, sign the update manifests and publish a GitHub release.
# Run it by hand (workflow_dispatch) to build without releasing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [football, f1, motogp, tetris, word, mario, luigi, pacman]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.mode }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32
          path: firmware
          command: idf.py -B build/${{ matrix.mode }} -DULTIMATRIX_MODE=${{ matrix.mode }} -DULTIMATRIX_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }} build
      - name: Merge the full-flash image for the web flasher
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32
          command: bash firmware/tools/build-webflasher.sh ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.mode }}
          path: |
            firmware/build/${{ matrix.mode }}/ultimatrix.bin
            web-flasher/firmware/${{ matrix.mode }}
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cryptography
      - name: Sign and package update images
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          mkdir -p .tools
          (umask 077; printf '%s\n' "$UPDATE_SIGNING_KEY" > .tools/update-signing.pem)
          python firmware/tools/package-firmware.py --flat --out dist/release
          rm .tools/update-signing.pem
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --title "$GITHUB_REF_NAME" --generate-notes
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-flasher
      - id: deployment
        uses: actions/deploy-pages@v4
