name: Retry failed build
# Re-runs only the failed jobs of a failed build once (flaky downloads and runners); a second failure stays failed.
on:
  workflow_run:
    workflows: [Build and release]
    types: [completed]
permissions:
  actions: write
jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh run rerun ${{ github.event.workflow_run.id }} --failed --repo ${{ github.repository }}
