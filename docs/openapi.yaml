openapi: 3.0.3
info:
  title: Ultimatrix clock API
  version: 0.9.0
  description: |
    The HTTP API of an Ultimatrix LED clock (ESP32, 64x64 HUB75 panel). It is what the clock's own settings page
    (`/`) uses, so everything the page can do is available here. Not every route exists in every build: faces
    are compiled in or out (the Pac-Man, Pong, Invaders, NFL and game-controller routes are the main ones),
    and the WLED routes are not in the bridge image.

    **Calling it**
    - The clock answers on port 80, by IP address or `.local` name. There is no TLS.
    - POST routes read their parameters as a form (`application/x-www-form-urlencoded`) or as query-string
      parameters; both work. The WLED, canvas-frame and timer routes take a JSON body instead (marked below).
    - Booleans in forms are mostly sent as `1`/`0`, or by the field being present (checkbox style); each
      field says which.

    **Access rules** (all routes)
    - `403` for clients outside the allowed network (setting `accessScope`) and for public host names (a name
      under a real top-level domain) unless `anyHost` is set. Open the clock by IP or `.local`.
    - POST bodies over 8192 bytes get `413`. A POST carrying an `Origin` header for another host gets `403`
      (a web page on another site cannot drive the clock). Requests without `Origin` (curl, Home Assistant,
      the WLED app) pass.
    - If an admin PIN is set, POST routes need an `X-Token` header (from `POST /api/auth`) and answer `401`
      with `{"message":"Enter the clock PIN.","pin":true}` without it. These stay open: `/api/auth`,
      `/api/ha/detect`, `/json`, `/json/state`, `/dlna/*`, `/api/wled*`, `/api/canvas/*`.

    **Verification.** The routes, parameters, ranges and status codes come from reading the firmware
    (`firmware/src/main.cpp`, `lib/wled/*`, `lib/core/*`). Nothing here was machine-checked against a running
    clock except `/api/dim-colour`, `/api/hue-test`, `/api/screen`, `/api/display` and `/api/settings`.
    Large response bodies (settings, Home Assistant configuration, sports schedule) list their fields but
    not every nested detail.
  license:
    name: See LICENSE in the repository
    url: https://github.com/vandalon/ultimatrix
servers:
  - url: http://{clock}
    description: The clock on your network
    variables:
      clock:
        default: ultimatrix.local
        description: IP address or .local name of the clock
tags:
  - name: Settings
    description: The settings page's state and saving
  - name: Display
    description: Screen preview, brightness, dim colours and tests
  - name: Security
    description: Admin PIN and login
  - name: Setup
    description: Wi-Fi setup, welcome screen, face lists
  - name: Firmware
    description: Updates and face installs
  - name: Sports
    description: Sports auto-switch
  - name: Storage
    description: Flash disk and saved data
  - name: Integrations
    description: MQTT and Home Assistant
  - name: Play
    description: Steering the game faces
  - name: WLED
    description: WLED-compatible control and the clock's own WLED options
  - name: Canvas
    description: Drawing canvas and GIF slots
  - name: DLNA
    description: DLNA media renderer for pictures
security:
  - {}
  - pinToken: []
paths:
  /api/settings:
    get:
      tags: [Settings]
      summary: State of the settings page
      description: Everything the page shows - current face, network, free storage, light sensor and all settings.
      responses:
        '200':
          description: The state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsState' }
    post:
      tags: [Settings]
      summary: Save settings
      description: |
        Send only the fields you want to change in the same form the page uses. A field that is a checkbox
        counts as on when present and off when absent, so a client that sends a partial form must send
        every checkbox it wants to keep on (for example `autoUpdate`, `nightClock`). Numeric
        fields are validated against the ranges below; a bad value answers `400` with a `message`.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/SettingsForm' }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/MessageError' }
        '500': { $ref: '#/components/responses/MessageError' }
  /settings:
    post:
      tags: [Settings]
      summary: Save settings (older path)
      description: Same handler as `POST /api/settings`.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/SettingsForm' }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/MessageError' }
  /api/catalog:
    get:
      tags: [Settings]
      summary: Pick lists for the current face
      description: Riders and drivers (F1/MotoGP) or word-clock languages, as `{value,label}` entries. Streamed.
      responses:
        '200':
          description: Entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Choice' }
  /api/teams:
    get:
      tags: [Settings]
      summary: Football teams catalog
      responses:
        '200':
          description: Team entries
          content:
            application/json:
              schema: { type: array, items: { type: object } }
  /api/timezones:
    get:
      tags: [Settings]
      summary: Time zone names
      responses:
        '200':
          description: Zone names
          content:
            application/json:
              schema: { type: array, items: { type: string } }
  /api/screen:
    get:
      tags: [Display]
      summary: Current picture on the panel
      description: |
        A 64x64, 24-bit BMP of the framebuffer, read back from the output after the driver's brightness
        rounding. Answers `503` while a game is being played or before the display is ready.
      responses:
        '200':
          description: BMP image
          content:
            image/bmp:
              schema: { type: string, format: binary }
        '503':
          description: Not available right now
          content:
            text/plain:
              schema: { type: string }
  /api/display:
    get:
      tags: [Display]
      summary: Panel brightness in use
      responses:
        '200':
          description: The brightness level applied to the panel
          content:
            application/json:
              schema:
                type: object
                properties:
                  panel: { type: integer, minimum: 0, maximum: 255, description: 'The panel brightness (0 to 255) the clock is showing right now, after the light sensor, night mode and the minimum have been applied' }
  /api/dim-colour:
    get:
      tags: [Display]
      summary: Dim-colour settings
      description: |
        How the driver shows very dim colours. A HUB75 panel cannot show every shade at low brightness, so
        a dim colour can round to black in one channel and change hue (a dim orange turns red, a dim grey turns pink).
        Three optional corrections exist: the **hue guard** (`guard`, on by default) lifts pixels that would round to
        black while keeping their hue; the **search** (`search`, off by default) looks for the closest reachable colour;
        and the **weights** (`wg` to `bb`) tell the search how strong the red, green and blue LEDs of your panel are.
        The weights depend on the panel; `firmware/tools/colour-calibrate.py` finds them. The calibration dialog in
        Settings uses `floor` and `night`. `/api/hue-test` shows test patches while you tune.
      responses:
        '200':
          description: Current values
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DimColour' }
    post:
      tags: [Display]
      summary: Change dim-colour settings
      description: |
        Send any of the fields. By default the result is stored in flash. With `save=0` it applies only
        until the next restart. `reset=1` restores the defaults but keeps the calibrated `floor` and the
        `night` level. The answer is the new state.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                search: { type: integer, enum: [0, 1], default: 0, description: 'Off by default. 1 turns on the dim-colour search: for very dim pixels it tries nearby combinations of the red, green and blue light levels and picks the one that looks closest to the wanted colour, using the weights below to correct for how the LEDs differ in strength' }
                guard: { type: integer, enum: [0, 1], default: 1, description: 'Hue guard; lifts pixels that would round to black, keeping the hue. On by default. Only acts below the pulse-width floor (about panel brightness 137/255), on pixels whose channels all round to level 1 or less' }
                restore: { type: integer, enum: [0, 1], default: 1, description: 'After the weights have shifted a dim colour, scale it back so it is about as bright as the original. Only matters when `search` is on' }
                brightness: { type: number, minimum: 0.01, maximum: 9.99, default: 0.06, description: 'How much the search cares about getting the brightness right compared with the hue. Higher keeps brightness, lower favours the exact colour' }
                extra: { type: integer, minimum: 1, maximum: 8, default: 2, description: 'How many light levels above the wanted one the search may use for a channel when it looks for a better match' }
                limit: { type: integer, minimum: 4, maximum: 40, default: 8, description: 'The search only runs for pixels whose brightest channel is at or below this many plane weights (the panel shows light in bit planes; a higher value covers brighter pixels)' }
                guardMin: { type: number, minimum: 0, maximum: 3.9, default: 0, description: 'Lowest light, in plane weights, the hue guard still lifts. 0 (default) lifts every non-black pixel; a higher value leaves very dark pixels black. Stored in 1/64 steps' }
                floor: { type: integer, minimum: 0, maximum: 200, default: 0, description: 'Lowest panel brightness (0-255) found by the colour calibration, where all colours still show. The Minimum brightness slider stretches over the range from here upwards. 0 = no calibration' }
                night: { type: integer, minimum: 0, maximum: 255, default: 31, description: 'Panel brightness (0-254) used in night mode; 31 is about 12 %. 0 = panel dark' }
                wg: { type: number, minimum: 0.1, maximum: 5, default: 1, description: 'Green weight for reds and ambers (red leads). Above 1 adds green to a dim red/amber/orange; 1 = neutral' }
                wb: { type: number, minimum: 0.1, maximum: 5, default: 1, description: 'Blue weight for reds and ambers (red leads). Above 1 adds blue; 1 = neutral' }
                gg: { type: number, minimum: 0.1, maximum: 5, default: 1, description: 'Green weight for greys and whites (no saturation). Blends towards `wg` as the colour gets more saturated; 1 = neutral' }
                gb: { type: number, minimum: 0.1, maximum: 5, default: 1, description: 'Blue weight for greys and whites. Blends towards `wb` as the colour gets more saturated; 1 = neutral' }
                og: { type: number, minimum: 0.1, maximum: 5, default: 1, description: 'Green weight when green leads (green, teal and their pastels); below 1 thins out the green that the red LED would otherwise dominate; 1 = neutral' }
                ob: { type: number, minimum: 0.1, maximum: 5, default: 1, description: 'Blue weight when green leads (green, teal and their pastels); 1 = neutral' }
                bg: { type: number, minimum: 0.1, maximum: 5, default: 1, description: 'Green weight when blue leads (blue, cyan and their pastels); 1 = neutral' }
                bb: { type: number, minimum: 0.1, maximum: 5, default: 1, description: 'Blue weight when blue leads (blue, cyan and their pastels); below 1 takes the violet out of a blue; 1 = neutral' }
                save: { type: integer, enum: [0, 1], default: 1, description: 0 = apply until restart only }
                reset: { type: integer, enum: [0, 1], description: 1 = restore defaults first }
      responses:
        '200':
          description: The new state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DimColour' }
  /api/hue-test:
    post:
      tags: [Display]
      summary: Show the colour test grid
      description: |
        Shows a grid of swatches on the panel at a chosen brightness: 8 hues x 8 columns of 100, 70, 50, 35,
        25, 18, 12 and 8 % of full colour (16 hue rows with `wide=1`). It ends after `secs` (at most 600),
        or at once with `b=0`. Optional tuning arguments change the driver live and are not stored.
        Read the result back with `GET /api/screen`.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                b: { type: integer, minimum: 0, maximum: 255, description: Panel brightness; 0 stops the test }
                secs: { type: integer, minimum: 0, maximum: 600, description: How long }
                deep: { type: integer, enum: [0, 1], description: Allow the lowest brightness to narrow the output window }
                wide: { type: integer, enum: [0, 1], description: 16 hue rows of 4 px instead of 8 of 8 px }
                ramp: { type: integer, minimum: 0, maximum: 255, description: 0 = the usual percentages; otherwise the last column is this many of 255 and each earlier one is 1.3x brighter }
                gd: { type: number, description: 'Hue guard drop share (0.1-1): at the lowest level the guard sets a channel back to 0 when it carries less than this share of the strongest channel''s light. 0 = off' }
                gc: { type: number, description: 'Hue guard carry share (0.1-1, default 0.5): the guard lifts a channel left at 0 when it carries at least this share of the strongest channel''s light' }
                gm: { type: number, description: 'Lowest light, in plane weights, the hue guard still lifts (same as `guardMin`); 0 lifts every non-black pixel' }
                off: { type: integer, minimum: 0, maximum: 7, description: 'Bits: 1 no search, 2 no hue guard, 4 no brightness restore' }
                lb: { type: number, description: 'Same as `brightness` in `/api/dim-colour`: weight of the brightness error in the search' }
                kx: { type: integer, description: 'Same as `extra` in `/api/dim-colour`: how many levels above the wanted one the search may use' }
                ll: { type: integer, description: 'Same as `limit` in `/api/dim-colour`: plane weights of the brightest channel up to which the search runs' }
                wg: { type: number, description: 'Green weight for reds and ambers (red leads). Above 1 adds green to a dim red/amber/orange; 1 = neutral' }
                wb: { type: number, description: 'Blue weight for reds and ambers (red leads). Above 1 adds blue; 1 = neutral' }
                gg: { type: number, description: 'Green weight for greys and whites (no saturation). Blends towards `wg` as the colour gets more saturated; 1 = neutral' }
                gb: { type: number, description: 'Blue weight for greys and whites. Blends towards `wb` as the colour gets more saturated; 1 = neutral' }
                og: { type: number, description: 'Green weight when green leads (green, teal and their pastels); below 1 thins out the green that the red LED would otherwise dominate; 1 = neutral' }
                ob: { type: number, description: 'Blue weight when green leads (green, teal and their pastels); 1 = neutral' }
                bg: { type: number, description: 'Green weight when blue leads (blue, cyan and their pastels); 1 = neutral' }
                bb: { type: number, description: 'Blue weight when blue leads (blue, cyan and their pastels); below 1 takes the violet out of a blue; 1 = neutral' }
                fl: { type: integer, enum: [0, 1], description: Scale pixels dimmer than the dimmest visible level up to it }
                gamma: { type: number, description: Power-law curve instead of CIE in the dim range; 0 = CIE }
                minb: { type: integer, minimum: 0, maximum: 255, description: Brightness floor in the driver }
      responses:
        '204': { description: Started or stopped }
  /api/night-test:
    post:
      tags: [Display]
      summary: Preview a night brightness
      description: |
        Shows the clock at a night brightness for a while. With the night clock on it is the red night
        clock; with it off it is the normal face at that brightness.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                b: { type: integer, minimum: 0, maximum: 255, description: Panel brightness; 0 stops }
                secs: { type: integer, minimum: 1, maximum: 600, default: 90, description: 'How long the night brightness preview stays on, in seconds (1 to 600)' }
                off: { type: integer, enum: [0, 1], description: 'With 1, `b=0` previews a dark panel instead of stopping the preview' }
      responses:
        '204': { description: Started or stopped }
  /api/auth:
    post:
      tags: [Security]
      summary: Log in with the admin PIN
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { type: string, description: 4 to 8 digits }
      responses:
        '200':
          description: Token for the `X-Token` header
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: 'The login token. Send it in the `X-Token` header of later changes' }
        '401':
          description: Wrong PIN
          content:
            application/json:
              schema: { type: object, properties: { message: { type: string, description: Short text saying what was wrong } } }
        '429':
          description: Too many wrong PINs
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, description: 'Short text saying what happened' }
                  wait: { type: integer, description: Seconds to wait }
  /api/pin:
    post:
      tags: [Security]
      summary: Set or remove the admin PIN
      description: An empty `pin` removes it. Otherwise 4 to 8 digits.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                pin: { type: string, description: 'The new admin PIN, 4 to 8 digits. An empty value removes the PIN' }
      responses:
        '200':
          description: Saved or removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, description: 'Short text saying what happened' }
                  pinSet: { type: boolean, description: 'True when an admin PIN is now set' }
                  token: { type: string, description: Present when a PIN was set }
        '400': { $ref: '#/components/responses/MessageError' }
        '500': { $ref: '#/components/responses/MessageError' }
  /api/wifi/setup:
    post:
      tags: [Setup]
      summary: Restart into Wi-Fi setup
      description: The clock restarts and opens its setup portal. It is offline until setup finishes.
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '500': { $ref: '#/components/responses/MessageError' }
  /api/welcome/dismiss:
    post:
      tags: [Setup]
      summary: Hide the welcome notice
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '500': { $ref: '#/components/responses/MessageError' }
  /api/welcome/start:
    post:
      tags: [Setup]
      summary: Leave the welcome screen and start the clock
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '500': { $ref: '#/components/responses/MessageError' }
  /api/firmware:
    get:
      tags: [Firmware]
      summary: Update status
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FirmwareStatus' }
    post:
      tags: [Firmware]
      summary: Start an update or switch face
      description: |
        With `mode` set to a prepared face the clock switches to it from the spare slot and restarts.
        Otherwise it downloads and installs the update (for that `mode`, or the current face).
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                mode: { type: string, description: A face id, for example `home` or `football` }
                force: { type: integer, description: 'Present: update even while a live match or session is running' }
      responses:
        '202': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/MessageError' }
        '409':
          description: Refused (busy, live data running, or not enough memory)
          content:
            application/json:
              schema: { type: object, properties: { message: { type: string, description: Why the update was refused }, live: { type: boolean, description: True when a live feed or game is running and the update waits }, lowMemory: { type: boolean, description: True when there is too little free memory } } }
  /api/firmware/check:
    post:
      tags: [Firmware]
      summary: Check for a newer version now
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                force: { type: integer, description: 'Present: check even while a live match is running' }
      responses:
        '202': { $ref: '#/components/responses/Message' }
        '429': { $ref: '#/components/responses/MessageError' }
  /api/firmware/reboot:
    post:
      tags: [Firmware]
      summary: Restart to install a downloaded update
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                mode: { type: string, description: 'Face to start after the restart (a face id such as `home`)' }
      responses:
        '202': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/MessageError' }
  /api/firmware/server:
    post:
      tags: [Firmware]
      summary: Set the update source
      description: An `http://` or `https://` address; empty means GitHub.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                url: { type: string, description: 'Address of the update server the clock checks for new firmware' }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/MessageError' }
  /api/sports:
    get:
      tags: [Sports]
      summary: Auto-switch plan and schedules
      description: Order, lead and hold times, per-sport next events and the day's count.
      responses:
        '200':
          description: Plan
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/sports/prepare:
    post:
      tags: [Sports]
      summary: Prepare a face in the spare slot
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, description: 'Face id to download into the spare memory, so switching to it later takes seconds' }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '202': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/MessageError' }
        '409': { $ref: '#/components/responses/MessageError' }
  /api/nfl/demo:
    post:
      tags: [Sports]
      summary: NFL demo screens (NFL build only)
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                'on': { type: integer, enum: [0, 1] }
      responses:
        '204': { description: Done }
  /api/storage:
    get:
      tags: [Storage]
      summary: Flash disk and cached data
      responses:
        '200':
          description: Storage state
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/storage/clear:
    post:
      tags: [Storage]
      summary: Clear cached data
      description: Saved drawings are never removed. With `updates` the update history is cleared.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                updates: { type: integer, description: 'Present: clear the update records' }
      responses:
        '200':
          description: The storage state after clearing
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/storage/reformat:
    post:
      tags: [Storage]
      summary: Format the flash disk (drawings are lost)
      responses:
        '200':
          description: Restarting
          content:
            application/json:
              schema: { type: object, properties: { restarting: { type: boolean, description: True when the clock is about to restart } } }
        '500': { $ref: '#/components/responses/MessageError' }
  /api/nvs:
    get:
      tags: [Storage]
      summary: Settings storage summary (text)
      description: The same text as the telnet `nvs` command.
      responses:
        '200':
          description: Text
          content:
            text/plain:
              schema: { type: string }
  /api/mqtt:
    get:
      tags: [Integrations]
      summary: MQTT link state
      responses:
        '200':
          description: State
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean, description: 'MQTT link to Home Assistant on or off' }
                  screenCamera: { type: boolean, description: 'Publish the panel picture as a Home Assistant camera whenever the screen changes' }
                  host: { type: string, description: 'Host name or IP address of the MQTT broker' }
                  port: { type: integer, description: 'Broker port (default 1883)' }
                  user: { type: string, description: 'Broker user name. Empty = no login' }
                  passwordSet: { type: boolean, description: 'True when a password is stored. The password itself is never returned' }
                  connected: { type: boolean, description: 'True while the clock is connected to the broker' }
                  status: { type: string, description: 'Short text about the connection state, for example why it failed' }
    post:
      tags: [Integrations]
      summary: Save the MQTT settings
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                enabled: { type: string, enum: ['0', '1'], description: 'MQTT link to Home Assistant on or off' }
                screenCamera: { type: string, enum: ['0', '1'], description: 'Publish the panel picture as a Home Assistant camera whenever the screen changes' }
                host: { type: string, description: IP address or host name of the broker }
                port: { type: integer, minimum: 1, maximum: 65535, default: 1883, description: 'Broker port (default 1883)' }
                user: { type: string, description: 'Broker user name. Empty = no login' }
                password: { type: string, writeOnly: true, description: 'Broker password. Write-only; leave empty to keep the stored one' }
                passwordClear: { type: string, enum: ['1'], description: Remove the stored password }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/MessageError' }
        '500': { $ref: '#/components/responses/MessageError' }
  /api/ha:
    get:
      tags: [Integrations]
      summary: Home Assistant face configuration and link state
      description: Host, port, TLS, whether a token is set (never the token), pages, tiles, icons, energy sensors, media players, washer, weather and doorbell.
      responses:
        '200':
          description: Configuration
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
    post:
      tags: [Integrations]
      summary: Save the Home Assistant configuration
      description: |
        Known form fields: `host`, `port`, `tls`, `token` (write-only), `clearToken`, `pages`, `phono`, `noinfo`,
        `thin`, `weeks`, `order`, `pageSecs`, `export`, `gridImportPositive`, `batteryDischargePositive`,
        `weather`, `doorbell`, `doorbellFlags`, `washerEntity`, `washerFlags`, and the tile, icon, energy and
        media-player entity fields the page sends. Invalid values answer `400`; a full settings storage `500`.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/MessageError' }
        '500': { $ref: '#/components/responses/MessageError' }
  /api/ha/suggest:
    get:
      tags: [Integrations]
      summary: Entity suggestions from Home Assistant
      parameters:
        - { name: kind, in: query, schema: { type: string }, description: Kind of entity wanted (for example power, energy or media player) }
        - { name: q, in: query, schema: { type: string }, description: Text to match }
      responses:
        '200':
          description: Entities, or an `error` text with an empty list
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, description: 'Why no suggestions could be made (empty when it worked)' }
                  entities:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, description: 'Entity id in Home Assistant, for example `sensor.power`' }
                        name: { type: string, description: 'Friendly name of the entity' }
                        unit: { type: string, description: 'Unit of measurement of the entity (W, kWh, %, …)' }
  /api/ha/detect:
    get:
      tags: [Integrations]
      summary: Result of the Energy dashboard detection
      description: Open without a PIN. Reads the result of the last `POST /api/ha/detect`.
      responses:
        '200':
          description: State, a note and the sensors found
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string, description: 'Result: whether the entities were found' }
                  note: { type: string, description: 'Explanation of what was detected or why it failed' }
                  entities: { type: array, items: { type: string }, description: 'The detected entity ids' }
        '500': { $ref: '#/components/responses/MessageError' }
    post:
      tags: [Integrations]
      summary: Ask Home Assistant for the Energy dashboard sensors
      description: Open without a PIN. Stores nothing.
      responses:
        '202': { $ref: '#/components/responses/Message' }
        '409': { $ref: '#/components/responses/MessageError' }
  /api/play/steer:
    post:
      tags: [Play]
      summary: Steer a game face (Pac-Man, Pong, Invaders builds)
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                dir: { type: integer, enum: [-1, 0, 1, 2, 3], description: '0 up, 1 right, 2 down, 3 left, -1 back to the computer; what each does is up to the face' }
      responses:
        '204': { description: Done }
  /api/pacman/steer:
    post:
      tags: [Play]
      summary: Steer Pac-Man (older path)
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                dir: { type: integer, description: 'Direction: 0 up, 1 right, 2 down, 3 left. Any other value gives control back to the face' }
      responses:
        '204': { description: Done }
  /play:
    get:
      tags: [Play]
      summary: Game controller WebSocket (Pong and Invaders)
      description: |
        WebSocket upgrade. Text frames "230" (steer codes) and "4" or "-1"; with an admin PIN set the first
        frame must be `t<token>`.
      responses:
        '101': { description: Switching protocols }
  /api/gamepad:
    get:
      tags: [Play]
      summary: Bluetooth game controller state (Pac-Man build)
      responses:
        '200':
          description: State
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean, description: 'Bluetooth game controller support on or off' }
                  state: { type: string, description: 'Connection state: `off`, `idle`, `starting`, `ready`, `searching`, `pairing`, `connecting` or `connected`' }
                  name: { type: string, description: 'Name of the paired controller' }
                  bonded: { type: integer, description: 'Number of paired controllers' }
  /api/gamepad/enable:
    post:
      tags: [Play]
      summary: Turn the controller support on or off
      description: The clock restarts, as memory is set aside at start.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                'on': { type: integer, enum: [0, 1] }
      responses:
        '204': { description: Saved; restarting }
        '507': { description: The settings storage is full }
  /api/gamepad/pair:
    post:
      tags: [Play]
      summary: Start pairing a controller
      responses:
        '204': { description: Started }
  /api/gamepad/forget:
    post:
      tags: [Play]
      summary: Forget bonded controllers
      responses:
        '204': { description: Done }
  /api/wled:
    get:
      tags: [WLED]
      summary: The clock's WLED options and live state
      description: enabled, listening, timeoutMin, ignoreLive, bootEffect, on, source, live, packets, dropped, free heap, and an effects list.
      responses:
        '200':
          description: Options
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
    post:
      tags: [WLED]
      summary: Save the WLED options
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                enabled: { type: string, enum: ['0', '1'], description: 'WLED overlay on or off: accept WLED apps and realtime protocols on the panel' }
                timeoutMin: { type: integer, minimum: 0, maximum: 255, description: 'Idle minutes before the WLED light is switched off. 0 = never' }
                ignoreLive: { type: string, enum: ['0', '1'], description: '1 = WLED commands and streams are ignored while a favourite match or an F1/MotoGP session is live' }
                bootEffect: { type: integer, description: Effect id, or -1 for none }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/MessageError' }
        '507': { $ref: '#/components/responses/MessageError' }
  /api/wled/timers:
    get:
      tags: [WLED]
      summary: WLED timers
      responses:
        '200':
          description: '`{"timers":[...]}`'
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
    post:
      tags: [WLED]
      summary: Save WLED timers
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/MessageError' }
  /api/wled/backup:
    get:
      tags: [WLED]
      summary: Download a backup of WLED options, state, presets and timers
      responses:
        '200':
          description: 'JSON with `"format":"ultimatrix-wled","version":1`'
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
    post:
      tags: [WLED]
      summary: Restore a backup
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/MessageError' }
  /wled:
    get:
      tags: [WLED]
      summary: WLED control page (HTML)
      responses:
        '200': { description: HTML page, content: { text/html: { schema: { type: string } } } }
  /json:
    get:
      tags: [WLED]
      summary: WLED full state, info, effects and palettes
      description: WLED-compatible. See the WLED JSON API documentation for the format.
      responses:
        '200': { description: JSON, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '404': { description: WLED is off in the settings }
    post:
      tags: [WLED]
      summary: Set WLED state
      description: Open without a PIN. Body is a WLED state object. Answers `{"success":true}`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Applied, content: { application/json: { schema: { type: object, properties: { success: { type: boolean, description: True when the frame was applied } } } } } }
        '400': { description: 'Not a JSON object (`{"error":9}`)' }
        '404': { description: WLED is off in the settings }
  /json/state:
    get:
      tags: [WLED]
      summary: WLED state
      responses:
        '200': { description: JSON, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
    post:
      tags: [WLED]
      summary: Set WLED state
      description: Open without a PIN.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Applied }
        '400': { description: Not a JSON object }
        '404': { description: WLED is off in the settings }
  /json/info:
    get: { tags: [WLED], summary: WLED info, responses: { '200': { description: JSON, content: { application/json: { schema: { type: object, additionalProperties: true } } } } } }
  /json/si:
    get: { tags: [WLED], summary: WLED state and info, responses: { '200': { description: JSON, content: { application/json: { schema: { type: object, additionalProperties: true } } } } } }
  /json/eff:
    get: { tags: [WLED], summary: Effect names, responses: { '200': { description: JSON array, content: { application/json: { schema: { type: array, items: { type: string } } } } } } }
  /json/effects:
    get: { tags: [WLED], summary: Effect names (alias of /json/eff), responses: { '200': { description: JSON array, content: { application/json: { schema: { type: array, items: { type: string } } } } } } }
  /json/pal:
    get: { tags: [WLED], summary: Palette names, responses: { '200': { description: JSON array, content: { application/json: { schema: { type: array, items: { type: string } } } } } } }
  /json/palettes:
    get: { tags: [WLED], summary: Palette names (alias of /json/pal), responses: { '200': { description: JSON array, content: { application/json: { schema: { type: array, items: { type: string } } } } } } }
  /json/fxdata:
    get: { tags: [WLED], summary: Effect parameter descriptions, responses: { '200': { description: JSON, content: { application/json: { schema: { type: array, items: { type: string } } } } } } }
  /json/nodes:
    get: { tags: [WLED], summary: Other WLED nodes, responses: { '200': { description: JSON, content: { application/json: { schema: { type: object, additionalProperties: true } } } } } }
  /json/cfg:
    get: { tags: [WLED], summary: WLED configuration, responses: { '200': { description: JSON, content: { application/json: { schema: { type: object, additionalProperties: true } } } } } }
  /presets.json:
    get: { tags: [WLED], summary: WLED presets, responses: { '200': { description: JSON, content: { application/json: { schema: { type: object, additionalProperties: true } } } } } }
  /win:
    get:
      tags: [WLED]
      summary: Legacy WLED HTTP API
      description: |
        Query parameters as in the old WLED API: `T` (0 off, 1 on, 2 toggle), `A` (brightness), `FX`, `SX`,
        `IX`, `FP` (palette), colour channels `R/G/B` (and the second/third colour), `TT` (transition, ms),
        `PL` (preset), `NL` (nightlight minutes). Refuses `Sec-Fetch-Site: cross-site`. Answers XML.
      responses:
        '200': { description: XML state, content: { text/xml: { schema: { type: string } } } }
        '403': { description: Cross-site request }
        '404': { description: WLED is off in the settings }
  /ws:
    get:
      tags: [WLED]
      summary: WLED WebSocket
      description: WebSocket upgrade for live WLED state.
      responses:
        '101': { description: Switching protocols }
  /gifs:
    get: { tags: [Canvas], summary: GIF loader page (HTML), responses: { '200': { description: HTML page, content: { text/html: { schema: { type: string } } } } } }
  /canvas:
    get: { tags: [Canvas], summary: Canvas editor page (HTML), responses: { '200': { description: HTML page, content: { text/html: { schema: { type: string } } } } } }
  /api/canvas:
    get:
      tags: [Canvas]
      summary: Canvas state
      description: Whether a canvas is active, the shown slot, cycle time, frames, import bytes, flash free and total, and the list of slots with id, name, frames, delay and bytes.
      responses:
        '200': { description: State, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /api/canvas/pixels:
    get:
      tags: [Canvas]
      summary: Current canvas pixels
      responses:
        '200': { description: Pixel data, content: { text/plain: { schema: { type: string } } } }
    post:
      tags: [Canvas]
      summary: Apply pixel changes
      description: Body is the compact change list the canvas page sends. Answers `{"pixels":<count>}`.
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string }
      responses:
        '200': { description: Applied, content: { application/json: { schema: { type: object, properties: { pixels: { type: integer, description: Number of pixels that were drawn } } } } } }
  /api/canvas/open:
    post: { tags: [Canvas], summary: Open the canvas or a slot for drawing, responses: { '200': { description: State } } }
  /api/canvas/rows:
    post:
      tags: [Canvas]
      summary: Write one row of pixels
      parameters:
        - { name: y, in: query, required: true, schema: { type: integer, minimum: 0, maximum: 63 } }
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string }
      responses:
        '200': { description: Applied }
  /api/canvas/clear:
    post: { tags: [Canvas], summary: Clear the canvas, responses: { '200': { description: Cleared } } }
  /api/canvas/save:
    post:
      tags: [Canvas]
      summary: Save the canvas, or the imported animation (`ram`), to a slot
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                slot: { type: integer, description: 'Saved picture slot to write' }
                name: { type: string, description: 'Name shown in the Saved picture list' }
                delay: { type: integer, minimum: 20, maximum: 60000, default: 100, description: Frame delay in ms }
                append: { type: string, description: 'Present: add a frame to the slot' }
                ram: { type: string, description: 'Present: save the imported animation held in RAM' }
      responses:
        '200': { description: Saved }
  /api/canvas/keep:
    post:
      tags: [Canvas]
      summary: Keep the played GIF in a vacant slot
      description: With `estimate` it only answers `{bytes, free, frames, fits}`.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                slot: { type: integer, description: 'Flash slot for the played GIF' }
                name: { type: string, description: 'Name shown in the Saved picture list' }
                estimate: { type: string, description: 'Present: only report whether it fits' }
      responses:
        '200': { description: Kept, or the estimate }
  /api/canvas/frame:
    post:
      tags: [Canvas]
      summary: Upload GIF frame data in chunks
      parameters:
        - { name: offset, in: query, schema: { type: integer } }
        - { name: size, in: query, schema: { type: integer } }
        - { name: total, in: query, schema: { type: integer } }
        - { name: delay, in: query, schema: { type: integer, minimum: 20, maximum: 60000 } }
        - { name: first, in: query, schema: { type: string }, description: 'Present on the first chunk: frees earlier import data' }
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string }
      responses:
        '200': { description: Chunk accepted }
  /api/canvas/slot:
    post:
      tags: [Canvas]
      summary: Load or delete a saved slot
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                slot: { type: integer, description: 'Slot number of the saved picture' }
                op: { type: string, enum: [delete], description: 'Omit to load the slot' }
                import: { type: string, description: 'Present with delete: the import is still running' }
      responses:
        '200': { description: The canvas state }
  /api/canvas/auth:
    post:
      tags: [Canvas]
      summary: Sign the GIF search page in
      description: |
        The clock signs the browser page in to the GIF search Worker. `202 {"pending":true}` while it
        does so; `200 {id, token, ttl}` when done. With `force` the old token is discarded.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                force: { type: string, description: '`1` asks for a new sign-in even when the page is already signed in' }
      responses:
        '200': { description: Token, content: { application/json: { schema: { type: object, properties: { id: { type: string, description: Identifier of this sign-in }, token: { type: string, description: Token the canvas page sends to the search service }, ttl: { type: integer, description: Seconds the token stays valid } } } } } }
        '202': { description: Pending }
  /api/canvas/cycle:
    post:
      tags: [Canvas]
      summary: Cycle through the saved slots
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                sec: { type: integer, minimum: 0, maximum: 3600, description: Seconds per slot; 0 stops }
      responses:
        '200': { description: Applied }
  /dlna/device.xml:
    get: { tags: [DLNA], summary: UPnP device description, responses: { '200': { description: XML, content: { text/xml: { schema: { type: string } } } } } }
  /dlna/av.xml:
    get: { tags: [DLNA], summary: AVTransport service description, responses: { '200': { description: XML, content: { text/xml: { schema: { type: string } } } } } }
  /dlna/cm.xml:
    get: { tags: [DLNA], summary: ConnectionManager service description, responses: { '200': { description: XML, content: { text/xml: { schema: { type: string } } } } } }
  /dlna/rc.xml:
    get: { tags: [DLNA], summary: RenderingControl service description, responses: { '200': { description: XML, content: { text/xml: { schema: { type: string } } } } } }
  /dlna/av/control:
    post:
      tags: [DLNA]
      summary: AVTransport SOAP control
      description: Play and Stop of pictures. Open without a PIN. Event subscriptions answer `412 Use polling`.
      requestBody:
        content:
          text/xml:
            schema: { type: string }
      responses:
        '200': { description: SOAP response, content: { text/xml: { schema: { type: string } } } }
  /dlna/cm/control:
    post:
      tags: [DLNA]
      summary: ConnectionManager SOAP control
      requestBody:
        content:
          text/xml:
            schema: { type: string }
      responses:
        '200': { description: SOAP response, content: { text/xml: { schema: { type: string } } } }
  /dlna/rc/control:
    post:
      tags: [DLNA]
      summary: RenderingControl SOAP control (not supported)
      requestBody:
        content:
          text/xml:
            schema: { type: string }
      responses:
        '401': { description: SOAP fault `Invalid Action` }
components:
  securitySchemes:
    pinToken:
      type: apiKey
      in: header
      name: X-Token
      description: Token from `POST /api/auth`; only needed when an admin PIN is set.
  responses:
    Message:
      description: Done
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
    MessageError:
      description: Refused or failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
  schemas:
    Message:
      type: object
      properties:
        message: { type: string, description: 'Short text saying what happened' }
    Choice:
      type: object
      properties:
        value: {}
        label: { type: string, description: 'Text shown for this choice' }
    DimColour:
      type: object
      properties:
        search: { type: integer, enum: [0, 1], description: '1 when the dim-colour search is on (off by default)' }
        guard: { type: integer, enum: [0, 1], description: '1 when the hue guard is on (default)' }
        restore: { type: integer, enum: [0, 1], description: '1 when the brightness restore after the weights is on' }
        brightness: { type: number, description: 'Weight of the brightness error in the search (default 0.06)' }
        extra: { type: integer, description: 'Levels above the wanted one the search may use (default 2)' }
        limit: { type: integer, description: 'Plane weights of the brightest channel up to which the search runs (default 8)' }
        guardMin: { type: number, description: Default 0 }
        floor: { type: integer, description: 'Calibrated lowest panel brightness, 0 = none' }
        night: { type: integer, description: 'Panel brightness in night mode; 0 with `nightOff` true means the panel is dark' }
        nightOff: { type: boolean, description: 'Present and true when night mode darkens the panel completely' }
        wg: { type: number, description: 'Green weight for reds and ambers (red leads). Above 1 adds green to a dim red/amber/orange; 1 = neutral' }
        wb: { type: number, description: 'Blue weight for reds and ambers (red leads). Above 1 adds blue; 1 = neutral' }
        gg: { type: number, description: 'Green weight for greys and whites (no saturation). Blends towards `wg` as the colour gets more saturated; 1 = neutral' }
        gb: { type: number, description: 'Blue weight for greys and whites. Blends towards `wb` as the colour gets more saturated; 1 = neutral' }
        og: { type: number, description: 'Green weight when green leads (green, teal and their pastels); below 1 thins out the green that the red LED would otherwise dominate; 1 = neutral' }
        ob: { type: number, description: 'Blue weight when green leads (green, teal and their pastels); 1 = neutral' }
        bg: { type: number, description: 'Green weight when blue leads (blue, cyan and their pastels); 1 = neutral' }
        bb: { type: number, description: 'Blue weight when blue leads (blue, cyan and their pastels); below 1 takes the violet out of a blue; 1 = neutral' }
    FirmwareStatus:
      type: object
      properties:
        version: { type: string, description: 'Firmware version running now' }
        message: { type: string, description: 'Progress or status text for the update' }
        busy: { type: boolean, description: 'True while an update is downloading or being written' }
        ready: { type: boolean, description: 'True when a downloaded update is ready to install' }
        failed: { type: boolean, description: 'True when the last update failed; see `message`' }
        received: { type: integer, description: 'Bytes of the update received so far' }
        total: { type: integer, description: 'Total size of the update in bytes' }
        lowMemory: { type: boolean, description: 'True when there is too little free memory to update right now' }
        available: { type: boolean, description: 'True when a newer version than `version` exists' }
        latest: { type: string, description: 'Newest version found on the update server' }
        checkError: { type: string, description: 'Why the last check for updates failed, empty when it worked' }
        checking: { type: boolean, description: 'True while the clock is checking for updates' }
        checkedAt: { type: integer, description: Unix time }
        server: { type: string, description: 'Update server address in use' }
        freeHeap: { type: integer, description: 'Free memory in bytes now' }
        minimumHeap: { type: integer, description: 'Lowest free memory in bytes since the last restart' }
    SettingsState:
      type: object
      description: Status fields, and the settings under `settings`.
      properties:
        mode: { type: string, description: Face name }
        modeId: { type: string, description: Face id }
        timeSynced: { type: boolean, description: 'True once the clock has set its time from the network' }
        lightReading: { type: integer, description: Light sensor reading }
        nightActive: { type: boolean, description: 'True while night mode is on' }
        nightWhy: { type: string, description: 'Why night mode is on: `dark` (light sensor), `schedule`, or empty' }
        nvsFree: { type: integer, description: Free entries in the settings storage }
        pinSet: { type: boolean, description: 'True when an admin PIN protects changes' }
        sunTimes: { type: object, additionalProperties: true, description: 'Sunrise and sunset for today, from the clocks location (object; empty when unknown)' }
        network:
          type: object
          properties:
            ssid: { type: string, description: 'Wi-Fi network the clock is connected to' }
            ip: { type: string, description: 'IP address of the clock' }
            hostname: { type: string, description: 'Network host name (`.local` address)' }
        welcomeHidden: { type: boolean, description: 'True when the welcome screen has been dismissed' }
        welcomeMode: { type: boolean, description: 'True while the welcome screen is showing on the panel' }
        settings: { $ref: '#/components/schemas/Settings' }
    Settings:
      type: object
      description: |
        The values the page edits. Names match the form fields of `POST /api/settings`. Only fields that exist
        in the running face's build are meaningful.
      properties:
        accessScope: { type: integer, minimum: 0, maximum: 2, description: 'Who may open the clock: 0 everything that can reach it, 1 private networks only (10.x, 172.16-31.x, 192.168.x; default), 2 only the clocks own network' }
        anyHost: { type: boolean, description: 'Allow requests that arrive under a public host name. Off (default) blocks them, which stops DNS-rebinding attacks from web pages' }
        mdnsUseName: { type: boolean, description: 'Use a hostname-safe version of `clockName` as the network address (for example `living-room-clock.local`) instead of `ultimatrix.local`. Several clocks add their MAC suffix automatically' }
        clockName: { type: string, description: 'Name of this clock. Used for MQTT, WLED, Home Assistant and the network address. Up to 48 characters' }
        brightness: { type: integer, minimum: 1, maximum: 255, description: 'Panel brightness, 1 (dimmest) to 255. Ignored while `autoBrightness` follows the light sensor, which then uses it as the top of its range' }
        rotation: { type: integer, minimum: 0, maximum: 3, description: 'Display orientation: 0 upright, 1 right 90°, 2 upside down 180°, 3 left 270°' }
        use24h: { type: integer, enum: [0, 1], description: 'Time format. 1 = 24-hour, 0 = 12-hour (the status JSON reports it as a boolean, true = 24-hour)' }
        ntpServer: { type: string, description: 'Host name of the primary time server (NTP)' }
        autoBrightness: { type: boolean, description: 'Set the brightness from the light sensor on `ldrPin`' }
        ldrPin: { type: integer, minimum: 32, maximum: 39, description: 'GPIO pin the light sensor (LDR) is connected to: 32 to 39' }
        minimumBrightness: { type: integer, minimum: 1, maximum: 255, default: 1, description: 'Brightness the clock shows at the darkest sensor reading, 1 to 255. With calibration (`floor` in `/api/dim-colour`) the slider starts at the calibrated lowest level' }
        ldrDark: { type: integer, minimum: 0, maximum: 4094, default: 50, description: 'Sensor reading of your darkest room. At or below it the brightness is `minimumBrightness` and the red night clock shows' }
        ldrLight: { type: integer, minimum: 1, maximum: 4095, default: 2500, description: 'Sensor reading of your brightest room. At or above it the brightness is `brightness`' }
        nightEnabled: { type: boolean, description: Night mode on a schedule }
        nightStart: { type: string, description: 'HH:MM, default 22:00' }
        nightEnd: { type: string, description: 'HH:MM, default 07:00' }
        nightBrightness: { type: integer, description: 'Panel brightness while night mode is on, 1 to 255 (default 3)' }
        nightSun: { type: boolean, description: Night from sunset to sunrise }
        nightClock: { type: boolean, default: false, description: Show the red night clock in night mode }
        timezone: { type: string, description: 'Timezone name, for example `Europe/Amsterdam`. Ignored while `autoTimezone` is on' }
        autoTimezone: { type: boolean, description: 'Detect the timezone from the network location each time the clock starts' }
        matchSecs: { type: integer, minimum: 3, maximum: 60, description: 'Seconds each page (a game, a list or a table) stays on the sports faces before the next one: 3 to 60' }
        resultMins: { type: integer, minimum: 0, maximum: 1440, description: 'Minutes a finished match stays in the rotation after the final whistle. 0 = until midnight' }
        timeStyle: { type: integer, minimum: 0, maximum: 5, description: 'Clock animation of the running face, 0 to 5: flip, fade, roll, dissolve, drift, shimmer (word clock: see `wordAnimation` and `wordDate`)' }
        dither: { type: boolean, description: 'Smoother dark colours at low brightness (ordered dithering). Off by default' }
        swapBlueGreen: { type: boolean, description: 'Swap the blue and green channels. Turn on if the panel shows the wrong colours. Needs a restart' }
        telnet: { type: boolean, description: 'Remote console over Telnet on the local network. No password: use only on a trusted network' }
        hiddenWifi: { type: boolean, default: false, description: 'The saved Wi-Fi network is hidden (read-only here: set on the Wi-Fi setup page when the clock is connected), so the clock retries the connection at boot instead of scanning for it first' }
        autoUpdate: { type: boolean, default: true, description: 'Check for a newer firmware once a day and install it automatically. The clock restarts when it installs' }
        birthdays: { type: string, description: 'Birthdays as one text, `MMDD:NAME:YYYY` entries separated by commas (up to 10). The year is optional (`0511:ELIOT:`), a space in a name is written as `_`. On the day the clock shows a birthday party instead of the face' }
        sportsOrder: { type: string, description: 'Sports that may take over the panel automatically, best first, as a comma list such as `f1,motogp,football`. Empty = automatic switching off' }
        sportsHome: { type: string, description: 'Face id the clock returns to when nothing is on. Empty = stay on the sports face' }
        sportsLead: { type: integer, description: 'Minutes before the start at which the clock switches to the sport' }
        sportsOthers: { type: boolean, description: 'Football: also switch for your favourite teams matches in competitions you do not follow (cups for example)' }
        sportsRacing: { type: boolean, description: 'Which F1 and MotoGP sessions switch the clock: 0 qualifying and races, 1 races only, 2 every session' }
        sportsFav: { type: boolean, description: 'Football: switch only for your favourite teams. Off = every match in the competitions you follow' }
        sportsMax: { type: integer, description: 'Maximum automatic switches into a sport per day' }
        sportsHold: { type: integer, description: 'Minutes the clock stays on a sport after it finished (end of the session or full time) before it goes home. 0 = at once' }
        sportsBridge: { type: integer, description: 'Minutes: when the same sport has another session starting within this time after one ends (for example FP1 and FP2) the clock stays. 0 = off' }
        fbLeagues: { type: string, description: 'Football competitions to follow (up to 10), as repeated fields or a comma list of competition ids' }
        fbTeams: { type: string, description: 'Favourite football teams (up to 8), as repeated fields or a comma list' }
        f1Drivers: { type: string, description: 'Favourite F1 or MotoGP drivers, as repeated fields or a comma list of driver ids' }
        showRankings: { type: boolean, description: 'Football: show the league table beside the upcoming fixtures' }
        footballOthers: { type: boolean, description: 'Football: also show your favourite teams matches in competitions you do not follow' }
        ballRoll: { type: boolean, description: 'Football: show the rolling-ball animation between matches' }
        numberFont: { type: integer, description: 'Use the alternative, wider scoreboard digits' }
        wordLanguage: { type: integer, description: 'Language the word clock speaks the time in. The weekday and date follow it' }
        wordAnimation: { type: integer, minimum: 0, maximum: 5, description: 'Word clock effect when the words change: 0 none, 1 letter shuffle, 2 rotate all effects, 3 letter lift, 4 pixel dissolve, 5 soft wipe' }
        wordDate: { type: integer, minimum: 0, maximum: 2, description: 'Word clock date line: 0 numbers (WED 14/10), 1 hidden, 2 in words together with the time every minute' }
        nbaTeams: { type: string, description: 'Favourite NBA teams, as a comma list of abbreviations. They are shown first and their baskets get the animation' }
        nbaIdle: { type: integer, description: 'What to show while no game is live: 0 the next-up page, 1 the big clock, 2 both in turn' }
        nbaTables: { type: boolean, description: 'East and West tables: 0 off, 1 between games, 2 always, also during games' }
        nbaLiveOnly: { type: boolean, description: 'While a game is live: 1 shows only the live games, 0 also the other pages (todays games, quarter scores, tables)' }
        nbaExtra: { type: boolean, description: 'Extra pages: todays games, quarter scores and your favourites. Off keeps the clock on the next-up page or big clock' }
        mlbTeams: { type: string, description: 'Favourite MLB teams, as a comma list of abbreviations' }
        mlbIdle: { type: integer, description: 'What to show while no game is live: 0 the next-up page, 1 the big clock, 2 both in turn' }
        mlbTables: { type: boolean, description: 'AL and NL tables: 0 off, 1 between games, 2 always, also during games' }
        mlbLiveOnly: { type: boolean, description: 'While a game is live: 1 shows only the live games, 0 also the other pages' }
        mlbExtra: { type: boolean, description: 'Extra pages: line scores and your favourites. Off keeps the clock on the next-up page or big clock' }
        mlbHours: { type: integer, description: 'Colour of the big clock hours: 0 the face''s own colour, 1 green, 2 pink, 3 blue, 4 lemon, 5 peach, 6 purple, 7 red, 8 orange, 9 cyan, 10 white (default 10, white)' }
        mlbMinutes: { type: integer, description: 'Colour of the big clock minutes: 0 the face''s own colour, 1 green, 2 pink, 3 blue, 4 lemon, 5 peach, 6 purple, 7 red, 8 orange, 9 cyan, 10 white (default 5, peach)' }
        nflTeams: { type: string, description: 'Favourite NFL teams, as a comma list of abbreviations' }
        nflIdle: { type: integer, description: 'What to show while no game is live: 0 the next-up page, 1 the big clock, 2 both in turn' }
        nflTables: { type: boolean, description: 'AFC and NFC tables: 0 off, 1 between games, 2 always, also during games' }
        nflLiveOnly: { type: boolean, description: 'While a game is live: 1 shows only the live games, 0 also the other pages' }
        nflExtra: { type: boolean, description: 'Extra pages: line scores and your favourites. Off keeps the clock on the next-up page or big clock' }
        nflHours: { type: integer, description: 'Colour of the big clock hours: 0 the face''s own colour, 1 green, 2 pink, 3 blue, 4 lemon, 5 peach, 6 purple, 7 red, 8 orange, 9 cyan, 10 white' }
        nflMinutes: { type: integer, description: 'Colour of the big clock minutes: 0 the face''s own colour, 1 green, 2 pink, 3 blue, 4 lemon, 5 peach, 6 purple, 7 red, 8 orange, 9 cyan, 10 white' }
        pongBackdrop: { type: integer, minimum: 0, maximum: 5, description: 'Brightness of the big clock behind the court: 0 off, 1 very dim, 2 dim, 3 medium, 4 bright, 5 brightest' }
        pongSpeed: { type: integer, minimum: 0, maximum: 4, description: 'Ball speed: 0 slowest, 1 slow, 2 normal, 3 fast, 4 fastest' }
        pongLevel: { type: integer, minimum: 0, maximum: 8, description: 'How well the computer plays: 0 (easiest) to 8 (shown as difficulty 1 to 9)' }
        pongDate: { type: integer, minimum: 0, maximum: 2, description: 'Day and month, in the minutes colour: 1 above the time, 2 below the time, 0 hidden' }
        pongDay: { type: integer, minimum: 0, maximum: 2, description: 'Weekday, in the hours colour: 1 above the time, 2 below the time, 0 hidden' }
        arcHours: { type: integer, description: 'Colour of the clock hours on Space Invaders and Pong: 0 the face''s own colour, 1 green, 2 pink, 3 blue, 4 lemon, 5 peach, 6 purple, 7 red, 8 orange, 9 cyan, 10 white' }
        arcMinutes: { type: integer, description: 'Colour of the clock minutes on Space Invaders and Pong: 0 the face''s own colour, 1 green, 2 pink, 3 blue, 4 lemon, 5 peach, 6 purple, 7 red, 8 orange, 9 cyan, 10 white' }
        arcScore: { type: integer, description: 'Colour of the score on Space Invaders and Pong: 0 the face''s own colour, 1 green, 2 pink, 3 blue, 4 lemon, 5 peach, 6 purple, 7 red, 8 orange, 9 cyan, 10 white' }
        color: { type: integer, description: 'Pac-Man wall colour: 0 blue walls with a dark red night clock (default), 1 pastel purple, 2 pastel green, 3 pastel pink, 4 pastel blue, 5 peach, 6 lemon, 7 orange, 8 red, 9 cyan. The wall colour also sets the night-clock colour' }
        dotColor: { type: integer, description: 'Pac-Man dot colour: 0 the face''s own colour, 1 green, 2 pink, 3 blue, 4 lemon, 5 peach, 6 purple, 7 red, 8 orange, 9 cyan, 10 white' }
        btPad: { type: boolean, description: 'Allow a Bluetooth game controller to steer Pac-Man. Off by default; uses about 90 KB of memory while on' }
        pacmanClockColor: { type: integer, description: 'Pac-Man clock hours colour: 0 the face''s own colour, 1 green, 2 pink, 3 blue, 4 lemon, 5 peach, 6 purple, 7 red, 8 orange, 9 cyan, 10 white' }
        clockMinutesColor: { type: integer, description: 'Pac-Man clock minutes colour: 0 the face''s own colour, 1 green, 2 pink, 3 blue, 4 lemon, 5 peach, 6 purple, 7 red, 8 orange, 9 cyan, 10 white' }
        clockShade: { type: integer, minimum: 0, maximum: 1, description: 'Clock brightness: 0 subtle, 1 strong' }
        marioWorld: { type: integer, minimum: 0, maximum: 10, description: 'Mario and Luigi world: 1 rotate every hour (random), 0 overground, 2 underground, 3 castle, 4 snow, 5 underwater, 6 cloud top, 7 ghost house, 8 lava, 9 airship, 10 demo (cycle through all worlds)' }
        f1Flags: { type: boolean, description: Host country flag on the race screens }
        f1Chequers: { type: boolean, default: true, description: Chequered flag squares behind the lists; hidden while a list is dimmed and loading }
    SettingsForm:
      type: object
      description: |
        Form fields of `POST /api/settings`: the keys of `Settings` above, plus `ghost1Color` to `ghost4Color` (Pac-Man ghost colours, 0 to 10 as in the colour list: 0 the ghost's own colour, 1 green, 2 pink, 3 blue, 4 lemon, 5 peach, 6 purple, 7 red, 8 orange, 9 cyan, 10 white).
        Checkbox-type fields (booleans) are on when present. `nightStart` and `nightEnd` are `HH:MM`.
        Selections (`fbLeagues`, `f1Drivers`, `nbaTeams`, `mlbTeams`, `nflTeams`) are repeated fields or
        comma lists and are capped at 400 characters each.
      additionalProperties: true
      properties:
        brightness: { type: integer, minimum: 1, maximum: 255, description: 'Panel brightness, 1 to 255' }
        minimumBrightness: { type: integer, minimum: 1, maximum: 255, description: 'Lowest brightness for the light sensor, 1 to 255' }
        f1Chequers: { type: string, description: 'Present: show the chequered background' }
        nightClock: { type: string, description: 'Present: the red night clock may replace the face' }
