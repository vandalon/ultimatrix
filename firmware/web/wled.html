<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#050809"><title>Ultimatrix · Light</title><link rel="stylesheet" href="/theme.css">
<style>body{padding:18px;max-width:560px;margin:0 auto}.card{padding:20px 22px}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.row button{flex:0 0 auto}input[type=color]{height:44px;padding:3px}h1{font-size:24px;margin:6px 0 16px}.presets{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.presets button{padding:10px 14px}#power.on{background:var(--accent);color:#03181f}.foot{text-align:center;font-size:12px;margin:18px 0}</style></head>
<body>
<h1>Ultimatrix light</h1>
<section class="card">
<div class="row"><button id="power" type="button">Off</button><span id="status" class="hint"></span></div>
<div class="field"><label for="bri">Brightness</label><input type="range" id="bri" min="1" max="255"></div>
<div class="field"><label for="fx">Effect</label><select id="fx"></select></div>
<div class="field"><label for="pal">Palette</label><select id="pal"></select></div>
<div class="field"><label for="sx">Speed</label><input type="range" id="sx" min="0" max="255"></div>
<div class="field"><label for="ix">Intensity</label><input type="range" id="ix" min="0" max="255"></div>
<div class="field row"><div><label for="c0">Colour</label><input type="color" id="c0"></div><div><label for="c1">Second colour</label><input type="color" id="c1"></div></div>
</section>
<section class="card" id="presetCard" hidden><label>Presets</label><div class="presets" id="presets"></div></section>
<section class="card" style="padding:12px"><iframe id="editorFrame" title="Pixel editor" src="/canvas?embed" scrolling="no" style="width:100%;height:900px;border:0;display:block"></iframe></section>
<p class="foot"><a href="/?settings">Clock settings</a></p>
<script>
const $=id=>document.getElementById(id);
const post=body=>fetch('/json/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(()=>load(true));
const hex=c=>'#'+c.map(v=>v.toString(16).padStart(2,'0')).join('');
const rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
let busy=0,canvasBusy=false,effectRunning=false,loading=false,refreshPending=false;
window.addEventListener('message',e=>{
  if(e.origin===location.origin&&e.source===$('editorFrame').contentWindow&&e.data?.type==='canvas-busy')canvasBusy=!!e.data.active;
});
async function load(force=false){
  if(!force&&busy>Date.now())return;
  if(loading){if(force)refreshPending=true;return}
  loading=true;
  try{
    const s=(await(await fetch('/json/si',{cache:'no-store'})).json()),st=s.state,g=st.seg[0];
    effectRunning=st.on&&(g.fx!==0||s.info.live);
    $('power').textContent=st.on?'On':'Off';$('power').className=st.on?'on':'';
    $('status').textContent=s.info.live?'Receiving a pixel stream':st.on?'Showing on the panel':'The clock face is showing';
    $('bri').value=st.bri;$('fx').value=g.fx;$('pal').value=g.pal;$('sx').value=g.sx;$('ix').value=g.ix;$('c0').value=hex(g.col[0]);$('c1').value=hex(g.col[1]);
  }catch(_){}finally{
    loading=false;
    if(refreshPending){refreshPending=false;load(true)}
  }
}
window.addEventListener('focus',()=>load());
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
async function init(){
  const fx=await(await fetch('/json/eff')).json(),pal=await(await fetch('/json/pal')).json();
  fx.forEach((n,i)=>{if(n!=='RSVD')$('fx').append(new Option(n,i))});
  pal.forEach((n,i)=>{if(n!=='RSVD')$('pal').append(new Option(n,i))});
  try{const p=await(await fetch('/presets.json')).json();let any=false;
    for(const[id,v]of Object.entries(p)){if(id==='0'||!v.n)continue;any=true;const b=document.createElement('button');b.type='button';b.className='secondary';b.textContent=v.n;b.onclick=()=>post({ps:+id});$('presets').append(b)}
    $('presetCard').hidden=!any}catch(_){}
  load();setInterval(()=>{if(!canvasBusy&&!effectRunning&&!document.hidden)load()},3000);
}
$('power').onclick=()=>post({on:$('power').textContent==='Off'});
$('bri').oninput=()=>{busy=Date.now()+1500};$('bri').onchange=()=>post({bri:+$('bri').value});
$('fx').onchange=()=>post({on:true,seg:[{fx:+$('fx').value}]});
$('pal').onchange=()=>post({seg:[{pal:+$('pal').value}]});
for(const k of['sx','ix']){$(k).oninput=()=>{busy=Date.now()+1500};$(k).onchange=()=>post({seg:[{[k]:+$(k).value}]})}
for(const k of['c0','c1'])$(k).onchange=()=>post({on:true,seg:[{col:[rgb($('c0').value),rgb($('c1').value)]}]});
const fit=()=>{try{const d=$('editorFrame').contentDocument;$('editorFrame').style.height=d.documentElement.scrollHeight+'px'}catch(_){}};
$('editorFrame').addEventListener('load',()=>{fit();try{new ResizeObserver(fit).observe($('editorFrame').contentDocument.body)}catch(_){}});
init();
</script></body></html>
